<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Codes - Sports Analytics GPT Ambassador Links</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs2-fix/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #0a0f1c;
            color: white;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: #FFD700;
        }
        .qr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .qr-card {
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        .qr-card h3 {
            margin-bottom: 1rem;
            font-size: 1rem;
        }
        .qr-code {
            display: flex;
            justify-content: center;
            margin: 1rem 0;
        }
        .qr-card a {
            color: #FFD700;
            text-decoration: none;
            font-size: 0.75rem;
            word-break: break-all;
            display: block;
            margin-top: 0.5rem;
        }
        .download-btn {
            background: #FFD700;
            color: #1e293b;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
            width: 100%;
        }
        .download-btn:hover {
            background: #e6c300;
        }
        @media print {
            .download-btn {
                display: none;
            }
            body {
                background: white;
                color: black;
            }
            .qr-card {
                background: #f0f0f0;
                break-inside: avoid;
            }
        }
    </style>
</head>
<body>
    <h1>📱 Ambassador Program QR Codes</h1>
    <div class="qr-grid" id="qrGrid"></div>
    <div style="text-align: center; margin-top: 2rem;">
        <button class="download-btn" onclick="window.print()">🖨️ Print QR Codes</button>
    </div>

    <script>
        const links = [
            { name: "Application Form", url: "https://forms.gle/EJ4rvXxA4UxUgtFa8" },
            { name: "Welcome Kit", url: "YOUR_WELCOME_KIT_LINK" },
            { name: "Schedule Call (Calendly)", url: "https://calendly.com/sportsanalyticsgpt1/30min" },
            { name: "Group Chat", url: "YOUR_GROUP_CHAT_LINK" },
            { name: "Asset Folder", url: "YOUR_ASSET_FOLDER_LINK" },
            { name: "App Download", url: "YOUR_APP_DOWNLOAD_LINK" },
            { name: "Ambassador Portal", url: "YOUR_AMBASSADOR_PORTAL_LINK" },
            { name: "Support Email", url: "mailto:ambassadors@sportsanalyticsgpt.com" }
        ];

        const grid = document.getElementById('qrGrid');
        
        links.forEach(link => {
            const card = document.createElement('div');
            card.className = 'qr-card';
            card.innerHTML = `
                <h3>${link.name}</h3>
                <div class="qr-code" id="qr-${link.name.replace(/\s/g, '')}"></div>
                <a href="${link.url}" target="_blank">${link.url.length > 40 ? link.url.substring(0, 40) + '...' : link.url}</a>
            `;
            grid.appendChild(card);
            
            // Generate QR code
            new QRCode(document.getElementById(`qr-${link.name.replace(/\s/g, '')}`), {
                text: link.url,
                width: 150,
                height: 150,
                colorDark: "#FFD700",
                colorLight: "#1e293b",
                correctLevel: QRCode.CorrectLevel.H
            });
        });
    </script>
</body>
</html>
